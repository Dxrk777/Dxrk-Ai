repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending

  - repo: local
    hooks:
      - id: spdx-header-go
        name: SPDX header (Go)
        entry: bash -c '! grep -rL "SPDX-License-Identifier" --include="*.go" vendor/ . | grep -v "^vendor/" | head -10 | grep .'
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: spdx-header-py
        name: SPDX header (Python)
        entry: bash -c '! grep -rL "SPDX-License-Identifier" --include="*.py" . | grep -v "^vendor/" | grep -v "__pycache__" | grep -v "node_modules" | head -10 | grep .'
        language: system
        files: '\.py$'
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: go vet ./...
        language: system
        files: '\.go$'
        pass_filenames: false

      - id: go-build
        name: go build
        entry: go build ./...
        language: system
        files: '\.go$'
        pass_filenames: false
