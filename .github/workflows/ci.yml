name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 3 * * *"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run unit tests (short, no Docker)
        run: go test -race -count=1 -shuffle=on -short ./...
      - name: Run go vet
        run: go vet ./...
      - name: Generate coverage report
        run: |
          go test -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | tail -1
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Python tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m pytest tests/ --cov=dxrk --cov-report=xml --cov-report=term-missing -q
      - name: Upload Python coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  python-typecheck:
    name: Python Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mypy
          pip install -e . 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
      - name: Run mypy
        run: mypy dxrk/ --ignore-missing-imports

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  full-tests:
    name: Full Tests (Docker + Race)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run full test suite
        run: go test -race -count=1 -shuffle=on -v ./... 2>&1 | tail -30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run benchmarks
        run: |
          go test -bench=. -benchtime=100ms -count=3 ./internal/router/... ./internal/rag/... ./internal/pipeline/... ./internal/sandbox/... ./internal/vault/... ./internal/observe/... ./internal/compress/... ./internal/tools/... 2>&1 | tee bench-results.txt
      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt

  bench-regression:
    name: Benchmark Regression Check
    runs-on: ubuntu-latest
    needs: bench
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Download baseline benchmarks
        uses: actions/download-artifact@v8
        with:
          name: bench-results
          path: .
      - name: Run benchmarks
        run: |
          go test -bench=. -benchtime=100ms -count=3 ./internal/router/... ./internal/compress/... ./internal/tools/... ./internal/pipeline/... 2>&1 | tee current.txt
      - name: Compare with benchstat
        run: |
          echo "=== Benchmark Comparison (baseline vs current) ==="
          benchstat bench-results.txt current.txt || true
          echo ""
          echo "=== Current Results ==="
          cat current.txt

  e2e-tests:
    name: E2E Tests (${{ matrix.platform.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: ubuntu
            dockerfile: Dockerfile.ubuntu
          - name: arch
            dockerfile: Dockerfile.arch
          - name: fedora
            dockerfile: Dockerfile.fedora
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build E2E image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: e2e/${{ matrix.platform.dockerfile }}
          tags: dxrk-e2e-${{ matrix.platform.name }}:ci
          load: true
          cache-from: type=gha,scope=e2e-${{ matrix.platform.name }}-v2
          cache-to: type=gha,mode=max,scope=e2e-${{ matrix.platform.name }}-v2
      - name: Run E2E tests
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_FULL_E2E: ${{ (github.event_name == 'push' || github.event_name == 'schedule') && '1' || '0' }}
        run: |
          docker run --rm \
            -e RUN_FULL_E2E \
            -e GITHUB_TOKEN \
            dxrk-e2e-${{ matrix.platform.name }}:ci

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: dxrk:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
