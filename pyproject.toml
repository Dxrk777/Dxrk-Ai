[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dxrk"
version = "4.0.0"
description = "Dxrk Ecosystem Configurator — supercharge AI coding agents"
requires-python = ">=3.13"
authors = [{ name = "Dxrk777" }]
license = { text = "MIT" }

dependencies = [
    "textual>=1.0,<2.0",
    "httpx>=0.27,<1.0",
]

[project.urls]
Homepage = "https://github.com/Dxrk777/Dxrk-Ai"

[project.scripts]
dxrk = "dxrk.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["dxrk*"]

[tool.setuptools.package-data]
dxrk = ["assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
  "antigravity: Antigravity adapter tests",
  "claude: Claude adapter tests",
  "codex: Codex adapter tests",
  "cursor: Cursor adapter tests",
  "gemini: Gemini CLI adapter tests",
  "kilocode: KiloCode adapter tests",
  "kimi: Kimi adapter tests",
  "kiro: Kiro IDE adapter tests",
  "openclaw: OpenClaw adapter tests",
  "opencode: OpenCode adapter tests",
  "pi: Pi adapter tests",
  "qwen: Qwen adapter tests",
  "vscode: VS Code adapter tests",
  "windsurf: Windsurf adapter tests",
]
