formatters:
  enable:
  - gofmt
  - goimports
  settings: {}
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  disable:
  - exhaustruct
  - varnamelen
  - nlreturn
  - wsl
  enable:
  - errcheck
  - govet
  - ineffassign
  - staticcheck
  - unused
  - bodyclose
  - goconst
  - gocritic
  - gosec
  - misspell
  - nakedret
  - nilerr
  - prealloc
  - revive
  - unconvert
  - unparam
  - whitespace
  - copyloopvar
  - durationcheck
  - errname
  - fatcontext
  - makezero
  - mirror
  - sqlclosecheck
  - tparallel
  - usestdlibvars
  - wastedassign
  exclusions:
    rules:
    - path: 'web/node_modules/'
      linters:
      - govet
      - errcheck
      - gosec
      - unused
      - ineffassign
    - path: '(.+_test\.go)'
      linters:
      - staticcheck
      - errcheck
      - gosec
      - ineffassign
      - unparam
    - linters:
      - staticcheck
      text: ST1005
      path: internal/installcmd/resolver\.go
    - path: internal/config/config\.go
      linters:
      - goconst
      - gosec
    - path: internal/auth/providers\.go
      linters:
      - gosec
    - path: internal/auth/oauth\.go
      linters:
      - gosec
    - path: internal/auth/securestorage\.go
      linters:
      - gosec
    - path: internal/bridge/advanced/.*\.go
      linters:
      - gosec
    - path: internal/commands/(doctor|init|keybindings)\.go
      linters:
      - gosec
    - path: internal/installcmd/resolver\.go
      linters:
      - gosec
    - path: internal/memory/consolidation\.go
      linters:
      - gosec
    - path: internal/security/ast\.go
      linters:
      - gosec
    - path: internal/services/autodream/autodream\.go
      linters:
      - gosec
    - path: internal/services/teammemorysync/teammemorysync\.go
      linters:
      - gosec
    - path: internal/tools/filetools/.*\.go
      linters:
      - gosec
    - path: internal/tools/lsptool/lsp\.go
      linters:
      - gosec
    - path: internal/tools/shell/bash\.go
      linters:
      - gosec
    - path: internal/tools/synthtools/(repl|transform)\.go
      linters:
      - gosec
    - path: internal/tools/tasktools/output\.go
      linters:
      - gosec
    - path: internal/tools/webtools/fetch\.go
      linters:
      - gosec
    - path: internal/utils/hooks/.*\.go
      linters:
      - gosec
    - path: internal/utils/fileops/.*\.go
      linters:
      - gosec
    - path: internal/utils/image/.*\.go
      linters:
      - gosec
    - path: internal/utils/http/.*\.go
      linters:
      - gosec
    - path: internal/utils/session/.*\.go
      linters:
      - gosec
    - path: internal/utils/diff/filediff\.go
      linters:
      - gosec
  settings:
    goconst:
      min-len: 5
      min-occurrences: 3
      ignore-tests: true
    revive:
      rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: deep-exit
      - name: defer
      - name: dot-imports
      - name: empty-block
      - name: error-naming
      - name: error-return
      - name: error-strings
      - name: errorf
      - name: function-result-limit
        arguments: [5]
      - name: identical-branches
      - name: if-return
      - name: import-shadowing
      - name: increment-decrement
      - name: indent-error-flow
      - name: modifies-parameter
      - name: modifies-value-receiver
      - name: range
      - name: range-val-in-closure
      - name: range-val-address
      - name: receiver-naming
      - name: string-of-int
      - name: struct-tag
      - name: superfluous-else
      - name: time-equal
      - name: time-naming
      - name: unconditional-recursion
      - name: unexported-naming
      - name: unexported-return
      - name: unnecessary-stmt
      - name: unreachable-code
      - name: useless-break
      - name: waitgroup-by-value
run:
  modules-download-mode: readonly
  timeout: 5m
  exclude-dirs:
    - web/node_modules
version: '2'
